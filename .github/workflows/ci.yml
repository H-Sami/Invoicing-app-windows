name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore locked dependencies
        run: dotnet restore MHC.Invoicing.sln --locked-mode

      - name: Verify formatting
        run: dotnet format MHC.Invoicing.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MHC.Invoicing.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test MHC.Invoicing.sln -c Release -p:Platform=x64 --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Test release packaging rules
        run: python tests/packaging/test_release_packaging.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
